# Model interface → concrete implementation mapping
# Change models here — no code changes needed.

generators:
  text:
    provider: llama_cpp
    model: qwen2.5-7b-instruct
    quantization: Q4_K_M
    repo: bartowski/Qwen2.5-7B-Instruct-GGUF
    file: Qwen2.5-7B-Instruct-Q4_K_M.gguf
    max_tokens: 8192
    temperature: 0.7
    # Desktop Forge targets the required 16 GiB host under the 11/12 GiB guard.
    n_ctx: 16384

  validator:
    provider: llama_cpp
    model: phi-3.5-mini-instruct
    quantization: Q4_K_M
    repo: bartowski/Phi-3.5-mini-instruct-GGUF
    file: Phi-3.5-mini-instruct-Q4_K_M.gguf
    max_tokens: 2048
    temperature: 0.3  # Lower for consistent validation

  image:
    provider: stable_diffusion_cpp
    model: sdxl-turbo
    quantization: Q8_0
    repo: OlegSkutte/sdxl-turbo-GGUF
    file: sd_xl_turbo_1.0.q8_0.gguf
    size: [512, 512]
    steps: 4  # SDXL-Turbo is trained for a short 1-4 step schedule

  music:
    provider: abc_notation  # LLM generates ABC text; music21 converts to MIDI
    uses: text  # Reuses the text generator model

  game_master:
    provider: llama_cpp
    model: llama-3.2-3b-instruct
    quantization: Q4_K_M
    repo: bartowski/Llama-3.2-3B-Instruct-GGUF
    file: Llama-3.2-3B-Instruct-Q4_K_M.gguf
    max_tokens: 256
    temperature: 0.8  # Slightly creative for in-character responses

# Worker configuration
pipeline:
  workers: 4                # Parallel workers for image/MIDI generation
  max_retries: 3            # Max retries per job on validation failure
  checkpoint_interval: 1    # Save checkpoint after every N completed jobs
  failure_policy: quarantine # quarantine | abort
  # Frozen v2 packages require complete media for every applicable node.
  image_coverage: 1.0       # Illustrations: REQUIRED (100%)
  midi_coverage: 1.0        # MIDI: REQUIRED (100%)

# RAM budget (MB)
limits:
  max_ram_mb: 10240         # 10 GB
  model_unload_threshold: 0.9  # Unload models when 90% RAM used

# Paths — relative to project root (StoryTeller/)
paths:
  models_dir: ai_models           # GGUF model files
  prompts_dir: src/prompts
  schemas_dir: schemas
  output_dir: tmp/output          # Generated .story, logs, checkpoints
