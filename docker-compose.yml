# StoryTeller Forge — Docker Compose
#
# Usage:
#   # Build the image
#   docker compose build
#
#   # Run overnight test (default: The Crystal Accord, seed 7)
#   docker compose run forge
#
#   # Custom parameters
#   docker compose run forge --seed 42 --tone dark_fantasy --title "The Ashen Marches"
#
#   # Monitor from host
#   tail -f tmp/output/pipeline_events.jsonl
#
#   # Resume after interruption
#   docker compose run forge --resume

services:
  forge:
    image: storyteller-forge:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Models: read-only (don't let the container modify downloaded models)
      - ./ai_models:/data/models:ro
      # Output: read-write — generated .story, logs, checkpoints
      - ./tmp/output:/data/output
      # Prompt templates and schemas (bundled in image, but mount for dev)
      # - ./src/prompts:/app/src/prompts:ro
      # - ./schemas:/app/schemas:ro
    environment:
      - PYTHONUNBUFFERED=1
      - STORYTELLER_MODELS_DIR=/data/models
    # No GPU needed — CPU-only llama.cpp inference
    # Keep the container limit BELOW the Docker Desktop VM size (~11.7 GiB)
    # so an overrun becomes a clean, logged OOM instead of host thrashing.
    mem_limit: 10g
    # Restart policy: don't auto-restart (long-running, want manual control)
    restart: "no"
    # Rotate docker's json-file logs so a 12h run cannot fill the VM disk.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
