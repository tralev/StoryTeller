[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storyteller-forge"
version = "0.1.0"
description = "The Forge: AI-powered interactive story generator"
readme = {text = "StoryTeller Forge — AI-powered interactive story generator. See ../README.md for full docs.", content-type = "text/plain"}
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "StoryTeller Contributors"}
]

dependencies = [
    "llama-cpp-python>=0.3.0",
    "stable-diffusion-cpp-python>=0.1.0",
    "music21>=9.1",
    "jsonschema>=4.20",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
forge = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require real models (slow)",
    "determinism: tests that verify reproducible output",
]
