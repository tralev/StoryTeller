[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storyteller-forge"
version = "0.1.0"
description = "The Forge: AI-powered interactive story generator"
readme = {text = "StoryTeller Forge — AI-powered interactive story generator. See ../README.md for full docs.", content-type = "text/plain"}
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "StoryTeller Contributors"}
]

dependencies = [
    "llama-cpp-python>=0.3.0",
    "stable-diffusion-cpp-python>=0.1.0",
    "music21>=8.1",
    "jsonschema>=4.20",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
    "ruff>=0.3",
    "mypy>=1.8",
    "psutil>=5.9",
]

[project.scripts]
forge = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
# Project convention: all generated/build artifacts live in tmp/
cache-dir = "tmp/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
# Project convention: all generated/build artifacts live in tmp/
cache_dir = "tmp/.mypy_cache"

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["arg-type", "type-arg", "no-untyped-def", "no-untyped-call", "union-attr", "operator", "var-annotated", "attr-defined", "misc", "no-redef", "return-value", "dict-item"]

[[tool.mypy.overrides]]
module = "scripts.*"
disable_error_code = ["arg-type", "no-untyped-def", "dict-item", "operator", "return-value", "union-attr", "no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Project convention: all generated/build artifacts live in tmp/
cache_dir = "tmp/.pytest_cache"
addopts = "--basetemp=tmp/pytest"
markers = [
    "integration: tests that require real models (slow)",
    "determinism: tests that verify reproducible output",
    "slow: tests that run real model inference (minutes per test)",
    "worldgen_property: deterministic randomized physical-world invariant tests",
    "history_property: deterministic randomized civilization/history invariant tests",
    "hardening: bounded WG-INTEGRATION-013 hardening matrix ownership",
    "release: expensive release evidence excluded from routine iteration",
    "asyncio: async tests using pytest-asyncio",
    "characterization: legacy prototype defect fixtures, never golden output",
]

[tool.coverage.run]
# Project convention: coverage data lives in tmp/
data_file = "tmp/.coverage"

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
